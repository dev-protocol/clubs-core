name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: install deps
        run: |
          corepack enable
          yarn

      - name: build
        run: yarn build

      - name: lint
        run: yarn lint

      - name: test
        run: yarn test:ci

      - name: astro check
        run: yarn typecheck
